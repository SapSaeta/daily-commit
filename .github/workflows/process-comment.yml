name: Process daily comment

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write

jobs:
  process-comment:
    if: contains(github.event.issue.labels.*.name, 'daily-prompt')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Save daily log from comment
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python scripts/log_from_comment.py

      - name: Generate graphs
        run: python scripts/generate_graphs.py

      - name: Commit log and graphs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Log daily prompt #${{ github.event.issue.number }}"
          file_pattern: logs/*.yml assets/*.svg

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Registro procesado. Gráficos actualizados.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
